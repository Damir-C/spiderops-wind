<script>
const DD={N:180,NNO:202.5,NO:225,ONO:247.5,O:270,OZO:292.5,ZO:315,ZZO:337.5,Z:0,ZZW:22.5,ZW:45,WZW:67.5,W:90,WNW:112.5,NW:135,NNW:157.5,VAR:0,STIL:0};
const SID=6340,PROV='Zuid-Holland';
function norm(r){return r?r.toUpperCase().trim():'VAR';}
function disp(r){const d=norm(r);return d.length>2?d.slice(0,2):d;}
async function upd(){
  try{
    const r=await fetch('https://data.buienradar.nl/2.0/feed/json');
    const d=await r.json();
    const s=d.actual.stationmeasurements.find(x=>x.stationid===SID)||d.actual.stationmeasurements[0];
    const raw=s.winddirection||'VAR';
    document.getElementById('wd').textContent=disp(raw);
    if(s.temperature!=null)document.getElementById('tp').textContent=s.temperature.toFixed(1);
    const deg=DD[norm(raw)]??DD[norm(raw).slice(0,2)]??0;
    document.getElementById('ndl').style.transform='rotate('+deg+'deg)';
  }catch(e){}
  try{
    const r=await fetch('https://cdn.knmi.nl/knmi/map/current/weather/warning/waarschuwingen_nederland_centraal.json');
    const d=await r.json();
    let code='Code Groen';
    if(d&&d.warnings){const w=d.warnings.find(x=>x.area&&x.area.toLowerCase().includes(PROV.toLowerCase().replace(/-/g,'')));if(w&&w.level)code=w.level;}
    const seg=document.getElementById('ks');
    document.getElementById('kv').textContent=code;
    const l=code.toLowerCase();
    seg.className='seg '+(l.includes('rood')?'rood':l.includes('oranje')?'oranje':l.includes('geel')?'geel':'groen');
  }catch(e){document.getElementById('kv').textContent='Code Groen';}
}
upd();setInterval(upd,120000);
</script>
